<text x="830" y="345" text-anchor="middle" font-family="Arial" font-size="17" fill="#166534">Private subnet: 10.20.1.0/24</text>
<text x="830" y="395" text-anchor="middle" font-family="Arial" font-size="18" fill="#0f172a">App-B: 10.20.1.10</text>
<text x="830" y="420" text-anchor="middle" font-family="Arial" font-size="14" fill="#475569">No public IPv4</text>
<path d="M475 405 L625 405" stroke="#7c3aed" stroke-width="5" stroke-dasharray="9 7"/>
<text x="550" y="385" text-anchor="middle" font-family="Arial" font-size="15" font-weight="bold" fill="#5b21b6">Peering</text>
<text x="550" y="580" text-anchor="middle" font-family="Arial" font-size="14" fill="#334155">Conceptual diagram — routes and security rules are required on both sides. VPC B has no Internet Gateway.</text>
<text x="270" y="72" text-anchor="middle" font-family="Arial" font-size="13" fill="#475569">Internet Gateway attached to VPC A</text>
