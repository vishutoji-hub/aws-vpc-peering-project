<text x="270" y="395" text-anchor="middle" font-family="Arial" font-size="18" fill="#0f172a">App-A: 10.10.2.10</text>
<text x="270" y="420" text-anchor="middle" font-family="Arial" font-size="14" fill="#475569">No public IPv4</text>
<rect x="595" y="90" width="470" height="450" rx="16" fill="#ede9fe" stroke="#7c3aed" stroke-width="3"/>
<text x="830" y="125" text-anchor="middle" font-family="Arial" font-size="21" font-weight="bold" fill="#5b21b6">VPC B: 10.20.0.0/16</text>
