<text x="550" y="35" text-anchor="middle" font-family="Arial" font-size="25" font-weight="bold" fill="#0f172a">AWS VPC Peering — Conceptual Architecture</text>
<rect x="35" y="90" width="470" height="450" rx="16" fill="#e0f2fe" stroke="#0284c7" stroke-width="3"/>
<text x="270" y="125" text-anchor="middle" font-family="Arial" font-size="21" font-weight="bold" fill="#075985">VPC A: 10.10.0.0/16</text>
