<text x="270" y="178" text-anchor="middle" font-family="Arial" font-size="17" fill="#92400e">Public subnet: 10.10.1.0/24</text>
<text x="270" y="215" text-anchor="middle" font-family="Arial" font-size="18" fill="#0f172a">Bastion: 10.10.1.10</text>
<text x="270" y="240" text-anchor="middle" font-family="Arial" font-size="14" fill="#475569">Public IPv4 • SSH entry point</text>
<rect x="65" y="315" width="410" height="180" rx="10" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/>
